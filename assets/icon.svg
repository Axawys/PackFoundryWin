        fill="url(#steelGear)" fill-rule="evenodd" stroke="#1d1f23" stroke-width="5"
        stroke-linejoin="round"/>
  <path d="M223.15 61.76L232.25 26.22A231 231 0 0 1 279.75 26.22L288.85 61.76A197 197 0 0 1 324.67 71.36L350.32 45.14A231 231 0 0 1 391.45 68.88L381.57 104.21A197 197 0 0 1 407.79 130.43L443.12 120.55A231 231 0 0 1 466.86 161.68L440.64 187.33A197 197 0 0 1 450.24 223.15L485.78 232.25A231 231 0 0 1 485.78 279.75L450.24 288.85A197 197 0 0 1 440.64 324.67L466.86 350.32A231 231 0 0 1 443.12 391.45L407.79 381.57A197 197 0 0 1 381.57 407.79L391.45 443.12A231 231 0 0 1 350.32 466.86L324.67 440.64A197 197 0 0 1 288.85 450.24L279.75 485.78A231 231 0 0 1 232.25 485.78L223.15 450.24A197 197 0 0 1 187.33 440.64L161.68 466.86A231 231 0 0 1 120.55 443.12L130.43 407.79A197 197 0 0 1 104.21 381.57L68.88 391.45A231 231 0 0 1 45.14 350.32L71.36 324.67A197 197 0 0 1 61.76 288.85L26.22 279.75A231 231 0 0 1 26.22 232.25L61.76 223.15A197 197 0 0 1 71.36 187.33L45.14 161.68A231 231 0 0 1 68.88 120.55L104.21 130.43A197 197 0 0 1 130.43 104.21L120.55 68.88A231 231 0 0 1 161.68 45.14L187.33 71.36A197 197 0 0 1 223.15 61.76ZM256 81A175 175 0 1 0 256 431A175 175 0 1 0 256 81Z"
        fill="none" stroke="url(#bevel)" stroke-width="3" fill-rule="evenodd"
        stroke-linejoin="round"/>

  <!-- Forge -->
  <circle cx="256" cy="256" r="168" fill="#120a06"/>
  <circle cx="256" cy="256" r="150" fill="url(#forge)"/>
  <circle cx="256" cy="256" r="150" fill="url(#faceShadow)"/>
  <circle cx="256" cy="256" r="170" fill="url(#rim)" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#ffc266" stroke-width="3.5"/>

  <!-- Hammer -->
  <g transform="translate(256 256) rotate(45)" filter="url(#drop)">
    <rect x="-21" y="-120" width="42" height="326"
          rx="21" fill="url(#handle)" stroke="#120b07" stroke-width="4"/>
    <rect x="-21" y="-120" width="42" height="326"
          rx="21" fill="url(#emberEdge)" opacity="0.35"/>
    <rect x="-32" y="-114" width="64" height="30"
          rx="6" fill="url(#neck)" stroke="#16181b" stroke-width="4"/>
    <polygon points="-100,-208 100,-208 118,-190 118,-126 100,-108 -100,-108 -118,-126 -118,-190" fill="url(#headTop)" stroke="#16181b"
             stroke-width="5" stroke-linejoin="round"/>
    <polygon points="-100,-208 100,-208 118,-190 118,-126 100,-108 -100,-108 -118,-126 -118,-190" fill="url(#headSides)"/>
    <polygon points="-100,-208 100,-208 118,-190 118,-126 100,-108 -100,-108 -118,-126 -118,-190" fill="url(#emberEdge)" opacity="0.45"/>
  </g>
</svg>
